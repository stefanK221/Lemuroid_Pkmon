name: GBA Plus debug APK

on:
  workflow_dispatch:
  push:
    branches: [feature/gba-plus-foundation]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source and emulator core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Checkout the bundled mGBA source revision
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: c758314a639aa0066e7b65a8341448181b73c804
          path: work/mgba-native
      - name: Install Android NDK for the repaired core
        run: |
          sdkmanager_path="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          if ! test -f "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"; then
            "$sdkmanager_path" 'ndk;27.2.12479018'
          fi
      - name: Test ROM patch restoration and rebuild mGBA
        run: bash tools/build_mgba_fixed.sh
      - name: Check preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gba-plus-debug-apk
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
          if-no-files-found: error
          retention-days: 14

