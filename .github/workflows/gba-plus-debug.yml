name: GBA Plus debug APK

on:
  workflow_dispatch:
  push:
    branches: [feature/gba-plus-foundation]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source and emulator core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gba-plus-debug-apk
          path: lemuroid-app/build/outputs/apk/freeBundle/debug/*.apk
          if-no-files-found: error
          retention-days: 14
