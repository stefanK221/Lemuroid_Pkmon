name: GBA save editor tests
on:
  push:
    branches: [feature/gba-plus-foundation, feature/gba-plus-quick-tools]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test save editor without sharing game files
        run: python -m unittest discover -s tools -p 'test_*.py' -v
