name: GBA Plus dynamic-flavor CI (not a playable patched-core APK)

on:
  push:
    branches:
      - feature/gba-plus-quick-tools
  workflow_dispatch:

jobs:
  verify-dynamic-flavor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile dynamic flavor and run unit tests (CI only)
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:testFreeDynamicDebugUnitTest :lemuroid-app:assembleFreeDynamicDebug --stacktrace
      # Do not publish this APK: the dynamic flavor downloads an upstream
      # mGBA core without the GBA Plus quick-command patch. Distributing it
      # as a "test APK" makes money/master-ball buttons appear to do nothing.
      # Only gba-plus-debug.yml bundles the rebuilt, patched mGBA core.
