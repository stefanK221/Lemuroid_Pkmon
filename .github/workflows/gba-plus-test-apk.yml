name: GBA Plus test APK

on:
  push:
    branches:
      - feature/gba-plus-quick-tools
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build test APK and unit tests
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:testFreeDynamicDebugUnitTest :lemuroid-app:assembleFreeDynamicDebug --stacktrace
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gba-plus-test-apk
          path: lemuroid-app/build/outputs/apk/freeDynamic/debug/*.apk
          if-no-files-found: error
